<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew Jackson AR</title>
  <!-- Load Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #f5f5f5; }
  </style>
</head>
<body>

  <model-viewer 
    src="andrew_jackson.glb" 
    ios-src="andrew_jackson.usdz"
    alt="3D model of Andrew Jackson" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate>
  </model-viewer>

</body>
</html>
