<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew Jackson AR</title>
  <!-- Load the Google Model-Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f0f0f0;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Replace the src URL below with your andrew_jackson.glb file once uploaded -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    alt="3D AR Test Model" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
